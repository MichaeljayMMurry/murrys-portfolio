<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murry's Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  
.game-video {
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 18px 0;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
}

.game-video iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.game-description,
.game-info {
    margin-top: 18px;
}

.game-description h3,
.game-info h3 {
    margin-bottom: 10px;
}

.game-info p {
    margin: 6px 0;
    line-height: 1.6;
}

:root{
  --bg:#F7F8FA;--ink:#0E1320;--muted:#5C6578;--line:#D9DDE6;--soft:#ECEFF5;--accent:#2748FF;--on:#FFFFFF;
  --f:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1018;--ink:#EDF0F7;--muted:#9BA5BB;--line:#262E40;--soft:#161C2A;--accent:#8CA0FF;--on:#0C1018;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1018;--ink:#EDF0F7;--muted:#9BA5BB;--line:#262E40;--soft:#161C2A;--accent:#8CA0FF;--on:#0C1018;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{font-weight:800;text-decoration:none;letter-spacing:-.01em}
nav{display:flex;gap:22px;align-items:center;overflow-x:auto}
nav a{text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;font-size:15px;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink);border-bottom-color:var(--accent)}
#theme{background:none;border:1px solid var(--line);color:var(--ink);font:500 14px var(--f);padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
#theme:hover{border-color:var(--accent)}
.hero{display:grid;grid-template-columns:1fr 320px;gap:56px;align-items:end;padding:72px 0 64px}
.hero h1{margin:0;font-size:clamp(46px,9vw,108px);line-height:.95;font-weight:800;letter-spacing:-.04em}
.hero .role{font-size:clamp(18px,2.2vw,22px);color:var(--muted);margin:24px 0 6px;max-width:34ch;line-height:1.45}
.hero .loc{margin:0 0 28px;color:var(--muted);font-size:15px}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;background:var(--soft);box-shadow:14px 14px 0 var(--accent);cursor:zoom-in;display:block}
.btn{display:inline-block;padding:12px 22px;border-radius:6px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--ink);margin:0 10px 10px 0;cursor:pointer;background:none;color:var(--ink);font-family:var(--f)}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn:hover{transform:translateY(-2px)}
.sec{display:grid;grid-template-columns:190px 1fr;gap:32px;padding:56px 0;border-top:1px solid var(--line)}
.sec>h2{margin:0;font-size:16px;font-weight:600;color:var(--muted);position:sticky;top:84px;align-self:start}
.sec h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.lead p{font-size:19px;max-width:58ch;margin:0 0 18px}
.meta{color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px 8px;margin:14px 0 0;padding:0;list-style:none}
.tags li{font-size:13px;font-weight:600;padding:2px 10px;border-radius:4px;background:var(--soft)}
ul.pts{margin:12px 0 0;padding-left:20px;color:var(--muted);max-width:62ch}ul.pts li{margin-bottom:6px}
.job+.job{margin-top:36px}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.stack h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:6px}
.stack p{margin:0;font-weight:500;line-height:1.9}
.row{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:30px 0;border-bottom:1px solid var(--line)}
.row:first-child{padding-top:0}.row:last-child{border-bottom:0;padding-bottom:0}
.row.noimg{grid-template-columns:1fr}
.row img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--soft);cursor:zoom-in}
.row h3 a{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.row h3 a:hover{color:var(--accent)}
.links a{font-weight:600;font-size:15px;color:var(--accent);margin-right:18px}
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
.gear a{text-decoration:none;display:block}
.gear img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--soft);margin-bottom:10px}
.gear a:hover b{color:var(--accent)}
.gear b{display:block;font-size:15px;line-height:1.35}.gear small{color:var(--muted)}
.certs{list-style:none;margin:0;padding:0}
.certs a{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none}
.certs li:first-child a{padding-top:0}
.certs b{font-weight:600}.certs a:hover b{color:var(--accent)}
.certs span{color:var(--muted);font-size:15px}
.edu{margin-top:40px}
.big{display:block;font-size:clamp(24px,5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.1;text-decoration:none;overflow-wrap:anywhere;margin:6px 0 20px}
.big:hover{color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-bottom:22px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:#18A872}
.soc{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:10px}
.soc a{font-weight:600}.soc a:hover{color:var(--accent)}
.gallery{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.gallery img{height:200px;width:auto;min-width:220px;object-fit:cover;border-radius:4px;background:var(--soft);cursor:zoom-in;flex:none;scroll-snap-align:start}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;padding:28px 0 110px}
.q{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.q .panel{display:none;width:min(300px,86vw);background:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:16px;box-shadow:6px 6px 0 var(--accent)}
.q.open .panel{display:block}.q .panel p{margin:0 0 12px}
.q .btn{margin:0 6px 6px 0}
.lb{position:fixed;inset:0;background:rgba(5,8,14,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:4px}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:40px;padding-top:44px}
  .photo{max-width:300px}
  .sec{grid-template-columns:1fr;gap:20px;padding:44px 0}.sec>h2{position:static}
  .row{grid-template-columns:1fr}
  nav{gap:16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:hover{transform:none}}

/* Certificate previews */
#certs .certs a{cursor:zoom-in;border-radius:4px}
#certs .certs a:hover,#certs .certs a:focus-visible{background:var(--soft)}
.cert-viewer{width:min(1200px,calc(100% - 32px));max-width:none;max-height:calc(100dvh - 32px);padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.cert-viewer::backdrop{background:rgba(5,8,14,.88)}
.cert-viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.cert-viewer-title{margin:0;font:600 16px/1.4 var(--f)}
.cert-viewer-close{flex:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--soft);color:var(--ink);font:600 14px var(--f);cursor:pointer}
.cert-viewer-close:hover{border-color:var(--accent)}
.cert-viewer-image{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain;margin:0 auto;background:#fff}

/* Certificate thumbnails and the looping photo gallery */
#certs .certs a{align-items:center;flex-wrap:nowrap;gap:24px;padding:20px 0}
#certs .certs li:first-child a{padding-top:0}
#certs .certs .cert-info{display:block;flex:1;min-width:0;color:var(--ink)}
#certs .certs .cert-info b{display:block;line-height:1.5}
#certs .certs .cert-issuer{display:block;margin-top:6px;color:var(--muted)}
#certs .cert-thumb{display:block;flex:none;width:176px;height:126px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;transition:transform .22s ease,box-shadow .22s ease}
#certs .certs a:hover .cert-thumb,#certs .certs a:focus-visible .cert-thumb{transform:scale(1.045);box-shadow:0 8px 22px rgba(14,19,32,.15)}
.gallery-content{min-width:0}
.gallery-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-bottom:8px}
.gallery-toggle,.gallery-step{border:1px solid var(--line);border-radius:6px;padding:7px 12px;background:var(--bg);color:var(--ink);font:600 14px var(--f);cursor:pointer;white-space:nowrap}
.gallery-toggle:hover,.gallery-step:hover{border-color:var(--accent)}
#gallery .gallery{display:block;overflow:hidden;padding:14px 0;scroll-snap-type:none}
.gallery-track{display:flex;width:max-content;animation:gallery-drift 64s linear infinite;will-change:transform}
.gallery-group{display:flex;align-items:center;gap:16px;padding-right:16px;flex:none}
.gallery-item{position:relative;display:block;flex:none;width:calc(240px * var(--photo-ratio));height:240px;padding:0;border:0;border-radius:6px;background:var(--soft);cursor:zoom-in;transition:transform .22s ease,box-shadow .22s ease}
#gallery .gallery-item img{display:block;width:100%;min-width:0;height:100%;object-fit:contain;border-radius:6px;scroll-snap-align:none}
.gallery-item:hover,.gallery-item:focus-visible{z-index:1;transform:scale(1.045);box-shadow:0 8px 22px rgba(14,19,32,.2)}
@keyframes gallery-drift{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.gallery-content.is-paused .gallery-track,.gallery-content.viewer-open .gallery-track{animation-play-state:paused}
@media (hover:hover){#gallery .gallery:hover .gallery-track{animation-play-state:paused}}
/* Keyboard users get a stable strip with every original photo reachable. */
#gallery .gallery:has(.gallery-group:not(.gallery-copy) .gallery-item:focus-visible){overflow-x:auto}
#gallery .gallery:has(.gallery-group:not(.gallery-copy) .gallery-item:focus-visible) .gallery-track{animation:none;transform:none}
#gallery .gallery:has(.gallery-group:not(.gallery-copy) .gallery-item:focus-visible) .gallery-copy{display:none}
.gallery-viewer-controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:12px}
#gallery-viewer .cert-viewer-image{max-height:calc(100dvh - 210px);background:transparent}
@media (max-width:600px){
  #certs .certs a{gap:16px}
  #certs .cert-thumb{width:116px;height:88px}
  #certs .certs .cert-info b{font-size:15px}
  #certs .certs .cert-issuer{font-size:13px;line-height:1.5}
  .gallery-toolbar .meta{font-size:13px}
  .gallery-item{height:200px;width:calc(200px * var(--photo-ratio))}
}
@media (max-width:360px){#certs .cert-thumb{width:92px;height:72px}}
@media (prefers-reduced-motion:reduce){
  .gallery-track{animation:none;transform:none;will-change:auto}
  #gallery .gallery{overflow-x:auto}
  .gallery-copy,.gallery-toggle{display:none}
  .gallery-item,#certs .cert-thumb{transition:none}
  .gallery-item:hover,.gallery-item:focus-visible,#certs .certs a:hover .cert-thumb,#certs .certs a:focus-visible .cert-thumb{transform:none}
}


/* Labeled contact buttons */
.contact-card{min-width:0;padding:28px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.contact-card .status{margin:8px 0 24px;color:var(--muted);font-size:14px}
.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.contact-group{min-width:0}
.contact-group h4,.contact-phone-label{margin:0 0 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.contact-buttons{display:grid;gap:10px}
.contact-link{display:flex;align-items:center;gap:10px;min-height:50px;padding:12px 14px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;line-height:1.4;text-decoration:none;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease}
.contact-link svg{display:block;flex:none;width:19px;height:19px}
.contact-link:hover,.contact-link:focus-visible{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-2px)}
.contact-phones{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.contact-phone-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:1000px) and (min-width:861px){.contact-grid{grid-template-columns:1fr}.contact-buttons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.contact-card{padding:20px}.contact-grid{grid-template-columns:1fr;gap:22px}.contact-buttons{grid-template-columns:repeat(2,minmax(0,1fr))}.contact-phone-buttons{grid-template-columns:1fr}.contact-link{padding:12px 10px;font-size:13px}}
@media (prefers-reduced-motion:reduce){.contact-link{transition:none}.contact-link:hover,.contact-link:focus-visible{transform:none}}

/* Large image-only previews on a dark backdrop */
.cert-viewer{width:100vw;height:100dvh;max-width:none;max-height:none;inset:0;margin:0;padding:56px 20px 20px;border:0;border-radius:0;overflow:hidden;background:transparent;color:#fff}
.cert-viewer[open]{display:flex;align-items:center;justify-content:center}
.cert-viewer::backdrop{background:rgba(0,0,0,.93)}
.cert-viewer .cert-viewer-head{position:absolute;top:8px;right:16px;left:16px;display:flex;justify-content:flex-end;margin:0;pointer-events:none}
.cert-viewer .cert-viewer-title{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cert-viewer .cert-viewer-close{display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font:400 32px/1 Arial,sans-serif;pointer-events:auto}
.cert-viewer .cert-viewer-close:hover{background:#fff;color:#111;border-color:#fff}
#cert-viewer .cert-viewer-image,#gallery-viewer .cert-viewer-image{width:auto;height:auto;max-width:100%;max-height:100%;margin:0;object-fit:contain;border-radius:4px;box-shadow:0 10px 50px rgba(0,0,0,.5)}
#gallery-viewer{padding-bottom:64px}
#gallery-viewer .gallery-viewer-controls{position:absolute;bottom:12px;left:0;right:0;margin:0;gap:16px}
#gallery-viewer .gallery-step{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}
#gallery-viewer .gallery-step:hover{background:#fff;color:#111;border-color:#fff}
#gallery-viewer .gallery-viewer-controls .meta{color:#fff}
@media (max-width:600px){.cert-viewer{padding-left:10px;padding-right:10px}.cert-viewer .cert-viewer-head{right:10px}}


/* Compact project list: descriptions stay hidden until a project is opened. */
.project-list{min-width:0;display:grid;gap:14px}
.project-detail{min-width:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.project-summary{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;list-style:none;cursor:pointer;transition:background .18s ease}
.project-summary::-webkit-details-marker{display:none}
.project-summary::marker{content:""}
.project-summary:hover,.project-summary:focus-visible{background:var(--soft)}
.project-summary b{display:block;font-size:20px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.project-summary small{display:block;margin-top:5px;color:var(--muted);font-size:14px;line-height:1.5}
.project-list>.project-section-label{margin:0;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.project-status{display:inline-flex;margin-bottom:10px;padding:4px 9px;border:1px solid var(--line);border-radius:3px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.project-development-note{padding:12px 15px;border-left:2px solid var(--accent);background:var(--soft);color:var(--muted);font-size:13px}
.project-roadmap{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.project-roadmap summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--ink)}
.project-roadmap summary:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
.project-toggle{flex:none;display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;color:var(--accent);font-size:25px;line-height:1;transition:transform .18s ease}
.project-detail[open] .project-summary{border-bottom:1px solid var(--line);background:var(--soft)}
.project-detail[open] .project-toggle{transform:rotate(45deg)}
.project-body{padding:24px}
.project-body h3{font-size:20px}
.project-body h4{margin:24px 0 10px;font-size:15px;font-weight:800}
.project-description p{margin:12px 0;color:var(--muted);max-width:65ch}
.project-facts{display:grid;grid-template-columns:minmax(95px,auto) 1fr;gap:8px 18px;margin:0;font-size:15px}
.project-facts dt{font-weight:600}
.project-facts dd{margin:0;color:var(--muted);overflow-wrap:anywhere}
.project-body .links{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:20px}
.project-body .links a{margin:0}
.project-screenshots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.project-shot{margin:0;min-width:0}
.project-shot button{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--soft);cursor:zoom-in;transition:transform .2s ease,border-color .2s ease}
.project-shot button:hover,.project-shot button:focus-visible{transform:translateY(-3px);border-color:var(--accent)}
.project-shot img{display:block;width:100%;height:250px;object-fit:contain;border-radius:3px}
.project-shot figcaption{margin-top:7px;color:var(--muted);font-size:13px;line-height:1.5}
#project-image-viewer{padding-bottom:64px}
#project-image-viewer .cert-viewer-image{width:auto;height:auto;max-width:100%;max-height:100%;margin:0;object-fit:contain;border-radius:4px;background:transparent;box-shadow:0 10px 50px rgba(0,0,0,.5)}
.project-image-controls{position:absolute;bottom:12px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px}
#project-image-viewer .gallery-step{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}
#project-image-viewer .gallery-step:hover{background:#fff;color:#111;border-color:#fff}
#project-image-viewer .meta{color:#fff}
@media (max-width:600px){
  .project-summary{padding:17px 16px;gap:12px}
  .project-summary b{font-size:18px}
  .project-body{padding:18px 16px}
  .project-facts{grid-template-columns:1fr;gap:2px}
  .project-facts dd{margin-bottom:10px}
  .project-screenshots{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .project-shot button{padding:6px}
  .project-shot img{height:220px}
}
@media (prefers-reduced-motion:reduce){.project-summary,.project-toggle,.project-shot button{transition:none}.project-shot button:hover,.project-shot button:focus-visible{transform:none}}


/* Personal equipment and full-size setup photos */
.setup-content{min-width:0}
.setup-header{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:24px}
.setup-header p{margin:0;max-width:38ch;color:var(--muted);font-size:16px}
.setup-header .btn{margin:0;flex:none}
.setup-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.setup-card{min-width:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--soft)}
.setup-media{display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:#fff}
.setup-media img{display:block;width:100%;height:100%;object-fit:contain}
.setup-media img.setup-phone-image{object-fit:cover}
.setup-image-crop{background-repeat:no-repeat}
.setup-card-text{padding:16px}
.sec .setup-card h3{font-size:16px;line-height:1.45;letter-spacing:0}
.setup-card p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}

          ${platform==='Contact'?`<a class="contact-link" href="#message-form" aria-label="Gmail: send a message">${contactIcon('mail')}<span>Gmail</span></a>`:''}

<section class="sec" id="gallery"><h2>Gallery</h2>

// Theme behavior is defined below.
$('#qpanel').innerHTML=`<p>Hi, I’m ${S.name.split(' ')[0]}. How can I help?</p><a class="btn fill" href="#message-form">Write a message</a>${S.resume?`<a class="btn" href="${S.resume}" target="_blank" rel="noopener">Resume</a>`:''}${soc.slice(0,1).map(s=>`<a class="btn" href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join('')}`;

document.addEventListener('click',e=>{

// Open certificates in their own preview without changing other image viewers.
const certViewer=document.getElementById('cert-viewer');
document.getElementById('certs').addEventListener('click',e=>{
  const link=e.target.closest('a[data-certificate]');
  if(!link)return;
  e.preventDefault();

  certViewer.querySelector('img').src=cert.image;

  document.getElementById('cert-viewer-title').textContent=cert.name;

});
certViewer.querySelector('button').addEventListener('click',()=>certViewer.close());
certViewer.addEventListener('click',e=>{
  if(e.target!==certViewer)return;
  certViewer.close();
});

// A duplicated strip makes the left-to-right loop seamless.
const galleryContent=document.querySelector('.gallery-content');
const galleryStrip=galleryContent.querySelector('.gallery');
const galleryToggle=galleryContent.querySelector('.gallery-toggle');
const galleryViewer=document.getElementById('gallery-viewer');
let galleryIndex=0;
const showGalleryPhoto=index=>{
  galleryIndex=(index+S.gallery.length)%S.gallery.length;
  const photo=S.gallery[galleryIndex];
  const image=galleryViewer.querySelector('img');
  image.src=photo.image;
  image.alt=photo.alt;
  document.getElementById('gallery-viewer-title').textContent='Gallery photo '+(galleryIndex+1);
  document.getElementById('gallery-viewer-count').textContent=(galleryIndex+1)+' / '+S.gallery.length;
};
galleryToggle.addEventListener('click',()=>{
  const paused=galleryContent.classList.toggle('is-paused');
  galleryToggle.setAttribute('aria-pressed',String(paused));
  galleryToggle.textContent=paused?'Resume gallery':'Pause gallery';
});
galleryStrip.addEventListener('click',e=>{
  const button=e.target.closest('button[data-gallery-index]');
  if(!button)return;
  e.stopPropagation();
  showGalleryPhoto(Number(button.dataset.galleryIndex));
  galleryContent.classList.add('viewer-open');
  galleryViewer.showModal();
});
galleryViewer.querySelector('.cert-viewer-close').addEventListener('click',()=>galleryViewer.close());
galleryViewer.querySelector('[data-gallery-prev]').addEventListener('click',()=>showGalleryPhoto(galleryIndex-1));
galleryViewer.querySelector('[data-gallery-next]').addEventListener('click',()=>showGalleryPhoto(galleryIndex+1));
galleryViewer.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    e.preventDefault();
    showGalleryPhoto(galleryIndex+(e.key==='ArrowRight'?1:-1));
  }
});
galleryViewer.addEventListener('click',e=>{
  if(e.target!==galleryViewer)return;
  galleryViewer.close();
});
galleryViewer.addEventListener('close',()=>galleryContent.classList.remove('viewer-open'));

// Short, stable branding in the header; full professional details stay in SITE.

headerBrand.innerHTML='<span class="brand-emblem" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-name"></span>';

const themeButton=document.getElementById('theme');

const navigationIcon=name=>{
  const paths={
    home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
    about:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
    projects:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    certs:'<path d="m3 8 9-5 9 5-9 5Z"/><path d="M6 10v6c4 3 8 3 12 0v-6M21 8v9"/>',
    contact:'<path d="M21 11a8 8 0 0 1-8 8H6l-4 3V11a9 9 0 0 1 19 0Z"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
};
document.getElementById('mobile-nav').innerHTML=[['Home','top','home'],['About','about','about'],['Work','projects','projects'],['Certs','certs','certs'],['Contact','contact','contact']].map(([label,id,icon])=>`<a href="#${id}"${id==='top'?' class="is-active" aria-current="location"':''}>${navigationIcon(icon)}<span>${label}</span></a>`).join('');
const navigationObserver=new IntersectionObserver(entries=>{
  const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
  if(!visible)return;
  const section=visible.target.id==='home'?'top':visible.target.id;
  document.querySelectorAll('#nav a,#mobile-nav a').forEach(link=>{
    const active=link.getAttribute('href')==='#'+section;
    link.classList.toggle('is-active',active);
    if(active)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');
  });
},{rootMargin:'-15% 0px -45% 0px',threshold:[0,.15,.4]});
['home','about','projects','skills','certs','contact'].forEach(id=>navigationObserver.observe(document.getElementById(id)));
document.getElementById('qbtn').textContent='Contact me';

copyEmail.addEventListener('click',async()=>{

});

// ShipMyForm's instant endpoint uses the public recipient email, with no API key.
// The owner enables inbox notifications through the first activation email.
const messageForm=document.getElementById('message-form');
const messageStatus=document.getElementById('message-status');
const sendMessageButton=document.getElementById('send-message');
const messageIdleText='Write to me here. No sign-in needed.';
const messageButtonText='Send message ↗';
const setMessageStatus=(state,message)=>{
  messageStatus.dataset.state=state;
  messageStatus.textContent=message;
  messageStatus.setAttribute('role',state==='error'?'alert':'status');
};
messageForm.addEventListener('input',()=>{
  if(messageStatus.dataset.state&&messageStatus.dataset.state!=='sending'){
    setMessageStatus('idle',messageIdleText);
  }
});
messageForm.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!messageForm.reportValidity()||sendMessageButton.disabled)return;
  if(location.protocol==='file:'){
    setMessageStatus('error','Please open the hosted portfolio to send your message.');return;
  }
  const formData=new FormData(messageForm);
  if(String(formData.get('_gotcha')||'').trim())return;
  const name=String(formData.get('name')||'').trim();
  const email=String(formData.get('email')||'').trim();
  const subject=String(formData.get('subject')||'').trim();
  const message=String(formData.get('message')||'').trim();
  if(!name||!email||!subject||message.length<10){
    setMessageStatus('error','Please complete all fields and write a message of at least 10 characters.');return;
  }
  sendMessageButton.disabled=true;
  messageForm.setAttribute('aria-busy','true');
  sendMessageButton.textContent='Sending…';
  setMessageStatus('sending','Sending your message…');
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  try{
    formData.set('name',name);
    formData.set('email',email);
    formData.set('subject',subject);
    formData.set('message',message);
    formData.set('_subject',"Murry's Portfolio: "+subject);
    formData.set('_replyto',email);
    const response=await fetch(messageForm.action,{
      method:'POST',credentials:'omit',headers:{'Accept':'application/json'},signal:controller.signal,
      body:formData
    });
    const result=await response.json();
    if(response.ok&&result.ok===true){
      setMessageStatus('success','Thank you. Your message has been submitted.');
      messageForm.reset();
    }else{
      console.error('Portfolio email delivery rejected',{status:response.status,message:result.message});
      throw new Error('Email delivery was not confirmed');
    }
  }catch(error){
    console.error('Portfolio email delivery failed',error);
    setMessageStatus('error',error.name==='AbortError'?'Sending took too long. Delivery could not be confirmed. Please email me directly below.':'Your message could not be sent. Please try again, or email me directly below.');
  }finally{
    clearTimeout(timeout);
    sendMessageButton.disabled=false;
    messageForm.removeAttribute('aria-busy');
    sendMessageButton.textContent=messageButtonText;
  }
});

</script>
